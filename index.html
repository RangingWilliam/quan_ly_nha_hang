<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👦🏿 LDBot - Lamar Davis Restaurant & Cart</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .scroll-clean::-webkit-scrollbar { width: 6px; }
    .scroll-clean::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-amber-50/40 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-red-800 to-amber-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🍜</span>
        <div>
          <h1 class="text-2xl font-bold tracking-wide">Lamar Davis Restaurant</h1>
          <p class="text-amber-100 text-sm">📍 67 Chamberlain Hills, Los Santos, USA | ☎️ Hotline: 318-237-3870</p>
        </div>
      </div>

      <!-- CONFIG -->
      <div class="flex items-center gap-2 bg-black/20 p-2 rounded-lg text-sm">
        <input id="apiKeyInput" type="password" placeholder="🔑 Dán Gemini API Key..."
          class="px-3 py-1.5 rounded bg-white text-gray-800 text-xs w-48 focus:outline-none" onchange="saveKey()" />
        <label class="flex items-center gap-1 cursor-pointer select-none text-xs px-2">
          <input id="mockToggle" type="checkbox" checked class="accent-amber-400" onchange="updateStatusBadge()" />
          <span>Mock Mode</span>
        </label>
        <span id="statusBadge" class="px-2 py-1 rounded text-xs font-semibold bg-amber-400 text-gray-900">Chế độ Giả lập</span>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT (3 COLUMNS) -->
  <main class="max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

    <!-- CỘT TRÁI: THỰC ĐƠN NHÀ HÀNG -->
    <section class="lg:col-span-4 flex flex-col bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden h-[660px]">
      <div class="bg-amber-100/70 px-4 py-3 border-b border-amber-200 flex justify-between items-center">
        <h2 class="font-bold text-amber-950 flex items-center gap-2">📋 Thực Đơn Nhà Hàng</h2>
        <span class="text-xs text-amber-800 bg-amber-200/80 px-2 py-0.5 rounded-full">Bấm để hỏi AI</span>
      </div>
      <div id="menuContainer" class="p-4 space-y-3 overflow-y-auto flex-1 scroll-clean"></div>
    </section>

    <!-- CỘT GIỮA: KHUNG CHAT SỬ DỤNG AI -->
    <section class="lg:col-span-5 flex flex-col bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden h-[660px]">
      <div class="bg-red-50 px-4 py-3 border-b border-red-100 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-red-700 text-white flex items-center justify-center">🤖</div>
          <div>
            <h2 class="font-bold text-gray-800 text-sm">Trợ Lý AI LDBot</h2>
            <p class="text-xs text-green-600 font-medium">● Trực tuyến - Đang kết nối Backend</p>
          </div>
        </div>
        <button onclick="clearChat()" class="text-xs text-gray-500 hover:text-red-600 px-2 py-1 rounded border border-gray-200">🗑️ Xóa chat</button>
      </div>

      <!-- ĐẶT MÓN NHANH -->
      <div class="px-4 py-2 bg-gray-50 border-b text-xs flex flex-wrap gap-1.5 items-center">
        <button onclick="sendChat('Lấy cho tôi 1 phần Yee-Yee Ass Burger!')" class="bg-white hover:bg-amber-50 text-gray-700 border px-2 py-1 rounded-full transition">🛒 Đặt 1 Burger</button>
        <button onclick="sendChat('Tôi muốn đặt 2 cái LD Organics Herbal Pizza')" class="bg-white hover:bg-amber-50 text-gray-700 border px-2 py-1 rounded-full transition">🍕 Đặt 2 Pizza</button>
        <button onclick="sendChat('iPhone đắt nhất hiện nay là gì?')" class="bg-white hover:bg-red-50 text-red-700 border px-2 py-1 rounded-full transition">📱 Lạc đề</button>
      </div>

      <!-- KHUNG TRÒ CHUYỆN -->
      <div id="chatBox" class="flex-1 p-4 space-y-4 overflow-y-auto scroll-clean bg-stone-50/50"></div>

      <!-- Ô NHẬP LIỆU -->
      <form onsubmit="handleChatSubmit(event)" class="p-3 bg-white border-t flex gap-2">
        <input id="userInput" type="text" placeholder="Nhập món ăn muốn đặt hoặc câu hỏi cho LDBot..." class="flex-1 px-4 py-2 rounded-xl border focus:outline-none focus:border-red-600 text-sm" />
        <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-medium px-4 py-2 rounded-xl text-sm transition">Gửi</button>
      </form>
    </section>

    <!-- CỘT PHẢI: GIỎ HÀNG (CART) -->
    <section class="lg:col-span-3 flex flex-col bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden h-[660px]">
      <div class="bg-amber-600 text-white px-4 py-3 font-bold flex justify-between items-center">
        <div class="flex items-center gap-2">🛒 <span>Giỏ Hàng Tự Động</span></div>
      </div>
      <div id="cartContainer" class="p-4 flex-1 overflow-y-auto scroll-clean space-y-3"></div>
      <div class="p-4 bg-gray-50 border-t space-y-3">
        <div class="flex justify-between text-sm font-bold text-gray-700">
          <span>Tổng số lượng:</span>
          <span id="totalItems">0 món</span>
        </div>
        <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm">
          🔔 Gửi Đơn Vào Nhà Bếp
        </button>
      </div>
    </section>

  </main>

  <script>
    const MENU_DATA = [
      { name: "Yee-Yee Ass Burger", description: "Chiếc burger bò phô mai siêu to khổng lồ giúp xóa bỏ mái tóc quê mùa.", ingredients: "Bánh mì, thịt bò nướng, cheddar, xà lách" },
      { name: "LD Organics Herbal Pizza", description: "Bánh Pizza đế mỏng phủ ngập ngụa thảo mộc thư giãn từ nông trại.", ingredients: "Đế pizza, sốt cà chua, mozzarella, thảo mộc organic" },
      { name: "Chop's Heavyweight Hotdog", description: "Chiếc hotdog siêu dài kẹp xúc xích cỡ bự đặt theo tên chú chó lực lưỡng.", ingredients: "Bánh mì hotdog, xúc xích béc-giê, hành tây" },
      { name: "Chamberlain Hills Fried Chicken", description: "Gà rán giòn rụm kiểu miền Nam dành cho các buổi tụ họp băng đảng.", ingredients: "Cánh đùi gà, bột chiên xù bí mật, sốt BBQ cay" }
    ];

    let cart = {};

    window.onload = function() {
      document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_key') || "";
      updateStatusBadge();
      renderMenu();
      renderCart();
      appendMessage("assistant", "Dạ LDBot xin chào quý khách! 🍀✨ Em đã kết nối thành công với máy chủ Backend Python. Quý khách có thể chat để đặt món ngay bậy giờ!");
    };

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = MENU_DATA.map(item => `
        <div onclick="sendChat('Tư vấn cho tôi món: ${item.name}')" class="p-3 bg-amber-50/50 hover:bg-amber-100/50 rounded-xl border border-amber-100 transition cursor-pointer group text-left">
          <h3 class="font-bold text-gray-800 text-sm group-hover:text-red-800">${item.name}</h3>
          <p class="text-xs text-gray-600 mt-1">${item.description}</p>
          <p class="text-[11px] text-gray-400 mt-1 italic">🔥 Thành phần: ${item.ingredients}</p>
        </div>
      `).join('');
    }

    function renderCart() {
      const container = document.getElementById('cartContainer');
      const keys = Object.keys(cart);
      
      if (keys.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">Giỏ hàng trống.<br>Hãy chat đặt món với LDBot!</div>`;
        document.getElementById('totalItems').innerText = "0 món";
        return;
      }

      let total = 0;
      container.innerHTML = keys.map(name => {
        total += cart[name];
        return `
          <div class="flex items-center justify-between p-2 bg-gray-50 border rounded-xl text-xs">
            <div class="flex-1 pr-2">
              <p class="font-bold text-gray-800">${name}</p>
              <p class="text-gray-500">Số lượng: <span class="font-bold text-amber-700">${cart[name]}</span></p>
            </div>
            <button onclick="updateCartItem('${name}', 0)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition">❌</button>
          </div>
        `;
      }).join('');
      
      document.getElementById('totalItems').innerText = `${total} món`;
    }

    function updateCartItem(name, quantity) {
      if (quantity <= 0) delete cart[name];
      else cart[name] = quantity;
      renderCart();
    }

    function checkout() {
      if (Object.keys(cart).length === 0) { alert("Giỏ hàng của bạn đang trống!"); return; }
      alert("🎉 Đơn hàng đã được chuyển tiếp vào nhà bếp xử lý!");
      cart = {};
      renderCart();
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chatBox');
      const avatar = role === 'assistant' ? '👩🏿‍🦲' : '👤';
      const bgClass = role === 'assistant' ? 'bg-amber-100/30' : 'bg-blue-50/30';
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 p-3 rounded-xl ${bgClass}`;
      msgDiv.innerHTML = `
        <div class="text-lg">${avatar}</div>
        <div class="flex-1 text-xs text-gray-800 leading-relaxed prose">${marked.parse(text)}</div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      if (!input.value.trim()) return;
      sendChat(input.value.trim());
      input.value = "";
    }

    async function sendChat(text) {
      appendMessage("user", text);
      const isMock = document.getElementById('mockToggle').checked;
const apiKey = document.getElementById('apiKeyInput').value;
// URL kết nối tới máy chủ Backend API Python FastAPI
const url = "127.0.0";
const requestBody = {
message: text,
api_key: apiKey,
use_mock: isMock,
model_name: "gemini-2.5-flash"
};
try {
const response = await fetch(url, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(requestBody)
});
if (!response.ok) throw new Error("Backend trả về lỗi hệ thống.");
const result = await response.json();
// Hiển thị văn bản trả lời của Bot
appendMessage("assistant", result.reply);
// Đổ dữ liệu JSON từ Backend vào Giỏ hàng trực quan ở Frontend
if (result.ordered_items && result.ordered_items.length > 0) {
result.ordered_items.forEach(item => {
const matched = MENU_DATA.find(m => m.name.toLowerCase() === item.item_name.toLowerCase());
if (matched) {
cart[matched.name] = (cart[matched.name] || 0) + item.quantity;
}
});
renderCart();
}
} catch (error) {
appendMessage("assistant", ⚠️ Lỗi kết nối: Vui lòng chạy lệnh 'python app.py' ở terminal trước để khởi động Backend API (${error.message}).);
}
}
function saveKey() { localStorage.setItem('gemini_key', document.getElementById('apiKeyInput').value); }
function clearChat() { document.getElementById('chatBox').innerHTML = ""; }
function updateStatusBadge() {
const isMock = document.getElementById('mockToggle').checked;
const badge = document.getElementById('statusBadge');
if (isMock) {
badge.innerText = "Chế độ Giả lập";
badge.className = "px-2 py-1 rounded text-xs font-semibold bg-amber-400 text-gray-900";
} else {
badge.innerText = "Gemini API Chạy Thật";
badge.className = "px-2 py-1 rounded text-xs font-semibold bg-green-500 text-white";
}
}
